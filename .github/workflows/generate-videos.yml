name: 動画自動生成（フルAI動画・撮影なし）

on:
  workflow_dispatch:
    inputs:
      week_file:
        description: "台本データのファイル名（画像素材/動画自動生成/配下、例: week1.json）"
        required: true
        default: "week1.json"

permissions:
  contents: read

env:
  APP_DIR: "画像素材/動画自動生成"

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: |
          pip install -r "$APP_DIR/requirements.txt"

      - name: 日本語フォントの確認（テロップの文字化け防止）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: VOICEVOX ENGINEの起動待ち
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:50021/version > /dev/null; then
              echo "VOICEVOX ENGINE ready"; exit 0
            fi
            echo "waiting for VOICEVOX ENGINE... ($i)"; sleep 2
          done
          echo "VOICEVOX ENGINE did not become ready in time"; exit 1

      - name: ① ナレーション音声を生成（VOICEVOX・無料）
        run: |
          python "$APP_DIR/voicevox_narrate.py" \
            --data "$APP_DIR/data/${{ github.event.inputs.week_file }}" \
            --out-dir out/audio \
            --engine-url http://localhost:50021

      - name: ② 静止画を生成（Cloudflare Workers AI・無料枠）
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python "$APP_DIR/generate_images.py" \
            --data "$APP_DIR/data/${{ github.event.inputs.week_file }}" \
            --out-dir out/images

      - name: ③ 動画を組み立て（ffmpeg・無料）
        run: |
          python "$APP_DIR/assemble_video.py" \
            --data "$APP_DIR/data/${{ github.event.inputs.week_file }}" \
            --audio-dir out/audio \
            --image-dir out/images \
            --out-dir out/videos \
            --bgm-dir "$APP_DIR/bgm"

      - name: 完成した動画をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.event.inputs.week_file }}
          path: out/videos/*.mp4
          retention-days: 14
