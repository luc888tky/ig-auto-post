name: Instagram Stories 自動投稿（毎日1本）

on:
  schedule:
    - cron: "0 3 * * *" # 毎日 12:00 JST（03:00 UTC）
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_DIR: "画像素材/動画自動生成"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 次の1本をInstagram/TikTok/YouTube Shortsに投稿
        env:
          # Instagram（必須）
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Instagram Reelsにも投稿するか（true/false）
          IG_POST_REELS: ${{ vars.IG_POST_REELS }}
          # TikTok（任意・設定されていれば投稿する）
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL }}
          # YouTube Shorts（任意・設定されていれば投稿する）
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: python "$APP_DIR/daily_post.py"
      - name: 投稿進捗をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/progress.json"
          if git diff --cached --quiet; then
            echo "進捗に変更なし（新規投稿なし）"
          else
            git commit -m "chore: 投稿進捗を更新"
            git push
          fi
